[project]
name = "cs5478-selfplay"
version = "0.1.0"
description = "Self-play reinforcement learning for closed-loop motion planning on nuPlan (CS5478 project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=13,<16",
    "aiofiles>=23,<26",
    "bokeh==2.4.3",
    "boto3>=1.34,<2",
    "cachetools>=5,<7",
    "geopandas>=0.14.4,<1",
    "hydra-core>=1.3.2,<1.4",
    "matplotlib>=3.8,<4",
    "nuplan-devkit==1.2.2",
    "numpy==1.26.4",
    "opencv-python-headless>=4.8,<4.12",
    "pandas>=2.2,<3",
    "pillow>=10,<13",
    "psutil>=5.9,<8",
    "pyogrio>=0.7,<1",
    "pyquaternion>=0.9.9,<1",
    # nuPlan imports pytest from its point cloud module at runtime.
    "pytest>=8,<10",
    "rasterio>=1.3.10,<2",
    "requests>=2.31,<3",
    "retry>=0.9.2,<1",
    "scipy>=1.12,<2",
    "setuptools>=70,<81",
    "shapely>=2.0,<3",
    "sqlalchemy>=1.4.54,<2",
    "torch==2.11.0",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
sim-visualizer = "cs5478_project.cli.serve:main"
nuplan-export = "cs5478_project.data.nuplan.export:main"
sim-train = "cs5478_project.training.train:main"

[project.optional-dependencies]
nuplan-eval = [
    "msgpack>=1.2.3",
    "pyarrow>=17,<20",
    "pyinstrument>=5.1.3",
    "pytorch-lightning>=2.6.6",
    "ray>=2.59.0",
    "rtree>=1.4.1",
    "tensorboard>=2.21.0",
    "ujson>=6.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs5478_project"]

[tool.uv.sources]
nuplan-devkit = { path = "../nuplan-devkit", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["timeout: per-test time limit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
